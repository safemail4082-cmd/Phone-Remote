plugins { id 'com.android.application' }

android {
    namespace 'com.bhaskar.tvremote'
    compileSdk 34
    defaultConfig {
        applicationId "com.bhaskar.tvremote"
        minSdk 21
        targetSdk 33
        // always higher than any earlier build, so each new APK installs as an update
        versionCode((System.currentTimeMillis().intdiv(60000)) as int)
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        shared {
            storeFile rootProject.file("sign.p12")
            storePassword "tvplayer123"
            keyAlias "tv"
            keyPassword "tvplayer123"
            storeType "pkcs12"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
}
